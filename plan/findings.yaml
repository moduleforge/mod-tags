version: 2
items:
    - title: Tag length checks count bytes not chars
      id: BTWb
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: 'api/service/tag.go validates purpose and value length with len(...) > 512 (lines 164, 170 in Create and 587 in UpdateTagValue), which counts UTF-8 bytes, while the tags table''s CHECK constraints (model/migrations/0201_tags.sql: char_length(purpose) <= 512, char_length(value) <= 512) count characters. A purpose or value of 200 multi-byte characters (over 512 bytes) is rejected with 400 even though the database would accept it. mod-tasks uses utf8.RuneCountInString for the same kind of check (api/service/task.go maxTaskTitleLen). Switch to a rune count (and add a multi-byte test) so the API limit matches the schema.'
closed: []
