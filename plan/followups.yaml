    - title: '.redocly.yaml missing extends: key'
      id: OCmP
      date: "2026-08-16"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
        - cross-repo/origin:mod-workflows
      text: 'Cross-project note surfaced from mod-workflows (followup AjNS): api/.redocly.yaml here has a `rules:` block (no-empty-servers: off, info-license: off) with no `extends:` key. A `rules:` block without `extends:` replaces the base ruleset with an empty one rather than layering on top, so this config silently lints against nothing. mod-workflows'' api/.redocly.yaml already fixed this by adding `extends: [recommended]`. Apply the same fix here.'
