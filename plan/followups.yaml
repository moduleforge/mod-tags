    - title: core-gui as hard dep breaks bun install
      id: QDH5
      date: "2026-07-19"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
        - plan/phase:phase-03-tag-gui-features
        - cross-repo/origin:app-mftodo
      text: |-
        [Moved from app-mftodo followups, originally id 1wsr — explicitly a cross-repo fix per the original finding] Attempted to set up real dependencies (yalc link + bun install) for app-mftodo phase-03 task worktrees to get real `bun run build`/`bun run lint` validation instead of the static-verification fallback used throughout the mod-tags-integration plan. Published fresh core-gui/users-gui/tasks-gui/tags-gui to the yalc store (all build clean individually). But `bun install` in app-mftodo/gui (after yalc-adding all four packages there) fails with `error: GET https://registry.npmjs.org/@moduleforge%2fcore-gui - 404`. Root cause: mod-tags/gui/package.json (this repo) declares `@moduleforge/core-gui` as a HARD `dependencies` entry (`file:.yalc/@moduleforge/core-gui`, relative to mod-tags/gui's own directory) plus a top-level `overrides` block forcing the same broken relative path, rather than the optional-peer pattern its sibling packages use: mod-tasks/gui and mod-users/gui/package.json both declare core-gui only under `peerDependencies` + `peerDependenciesMeta: { "@moduleforge/core-gui": { "optional": true } } }`, with no `dependencies` or `overrides` entry — that's the pattern that lets bun treat it as satisfied-by-whatever's-at-the-top-level rather than trying to re-resolve a relative file: path that only makes sense from inside mod-tags/gui's own checkout. Fix needed in mod-tags/gui/package.json (this repo): move `@moduleforge/core-gui` out of `dependencies`, drop the `overrides` block, and add `peerDependenciesMeta: { "@moduleforge/core-gui": { "optional": true } } }` alongside the existing `peerDependencies` entry, matching tasks-gui/users-gui exactly. Until this lands, any app-mftodo GUI task touching tags-gui cannot get a real `bun install`/build — the static-verification fallback remains necessary there.

        UPDATE (2026-08-02, tags-one-of-domain plan, phase-03): in a task worktree cut from this repo's current main, `gui/package.json` was found to ALREADY use the correct `peerDependenciesMeta.optional: true` pattern for `@moduleforge/core-gui` — `bun install` itself now succeeds and no longer trips on the originally-diagnosed cause above. However, full `tsc --noEmit`/Ladle validation was still blocked in that environment because no `@moduleforge/core-gui` package/build was reachable anywhere on the machine — a distinct "no local core-gui source/build available to link" problem, not the hard-dependency issue this item originally diagnosed. Worth re-verifying whether this item's root cause is already fixed on main and, if so, narrowing/retitling it to track only the remaining build-availability gap.
