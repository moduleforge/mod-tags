    - title: Reserve @moduleforge npm scope
      id: itQh
      date: "2026-07-18"
      tag: gui-error-handling
      text: '[phase-review: phase-02-gui-error-handling] Security lens (major, medium confidence): the `@moduleforge` npm scope is confirmed unclaimed on the public npm registry today. This plan''s phase 2 promoted `@moduleforge/core-gui` from an optional to a required peer dependency of `@moduleforge/tags-gui`; a partial code-level mitigation (pinning the peer version + documenting the required local yalc-override step for downstream consumers) was applied as part of the phase gate fix, but the underlying dependency-confusion/scope-squatting exposure is inherent to the whole `@moduleforge/*` package ecosystem using an unpublished, unclaimed npm scope (every `mod-*/gui` package that depends on another `@moduleforge/*` package shares this exposure, not just mod-tags). Closing it fully requires an org-level decision: either reserve the `@moduleforge` scope on the public npm registry (even as placeholder packages), or set up a private registry, or formally document/enforce the yalc-override convention across all consumers. This is a business/infrastructure decision, not something a single plan''s code task can resolve — surfacing for the project owner to decide.'
