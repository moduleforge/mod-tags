      text: '[phase-01-go-apiresp-migration/002-entityresolver-masking-adoption.md] GetByUUID''s own post-resolve residual fetch (tag.go:263, tagQ.GetTagByEntityUUID after the entity already resolved) still returns ErrNotFound (404) in the same data-consistency edge case that sites 3–5 now mask to ErrForbidden. Explicitly out of task 002''s Requirements 1–6 (masking audit categorizes GetByUUID/site 1 as ''already masked... keep''), so left unchanged. Flagging as a minor residual inconsistency worth a follow-up decision.'
