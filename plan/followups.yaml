      text: '[phase-02-gui-error-handling/001-adopt-shared-request-client.md] The tsup DTS build emits a benign ''unused import'' warning for the re-exported wire types (ApiError/ApiErrorResponse/FieldErrorData/ApiRequestError) because gui/src/index.ts doesn''t forward them to the package''s public entry graph — this task''s Validation pins index.ts as unchanged, so left alone; task 002 (component-layer half) will likely need to decide whether/how to surface these types from index.ts for TagEditor/TagList consumers to catch typed errors.'
